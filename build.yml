name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose Build Profile (Select what you want to build)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Build APK (Local on Runner)
        run: eas build -p android --profile ${{ github.event.inputs.build_type }} --local --output app-build.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # ডাউনলোড করার সময় যেন বুঝতে পারেন এটা কোন ফাইল, তাই নামটাও ডায়নামিক করে দিলাম
          name: app-${{ github.event.inputs.build_type }}-apk 
          path: app-build.apk